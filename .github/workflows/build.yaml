name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Run plugin tests
        run: |
          (cd plugins/proxy && flutter pub get && flutter test --reporter expanded)
          (cd plugins/setup/buildkit/build_tool && dart pub get && dart test --reporter expanded)

      - name: Test Linux CLI
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=linux go test -tags cli ./...
          CGO_ENABLED=0 GOOS=linux go vet -tags cli ./...

      - name: Test Windows helper
        working-directory: services/helper
        run: |
          cargo test --all-features
          cargo clippy --all-features -- -D warnings

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: core/go.sum

      - name: Build TUI packages
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          VERSION="${VERSION#v}" packaging/build-deb.sh

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-linux-${{ matrix.arch }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  changelog:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          heading="## FlClash TUI $CURRENT_TAG"
          grep -Fxq "$heading" CHANGELOG.md && exit 0
          temp="$(mktemp)"
          if grep -Fxq '## Unreleased' CHANGELOG.md; then
            awk -v heading="$heading" '
              !replaced && $0 == "## Unreleased" { print heading; replaced=1; next }
              { print }
            ' CHANGELOG.md > "$temp"
          else
            previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
            range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
            {
              printf '%s\n\n' "$heading"
              git log --no-merges --pretty=format:'- %s%n' "$range"
              printf '\n'
              cat CHANGELOG.md
            } > "$temp"
          fi
          mv "$temp" CHANGELOG.md

      - name: Commit
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "chen08209@gmail.com"
            git config --local user.name "chen08209"
            git commit -m "Update changelog"
            if git push; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
          range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
          : > release.md
          git log --no-merges --pretty=format:'- %s%n' "$range" >> release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: FlClash TUI ${{ github.ref_name }}
          files: ./dist/*
          body_path: './release.md'
          make_latest: true
