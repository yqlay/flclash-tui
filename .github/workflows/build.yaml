name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Run plugin tests
        run: |
          (cd plugins/proxy && flutter pub get && flutter test --reporter expanded)
          (cd plugins/setup/buildkit/build_tool && dart pub get && dart test --reporter expanded)

      - name: Setup terminal regression tests
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install terminal test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix packaging/terminal-tests

      - name: Test Linux CLI
        working-directory: core
        env:
          FLCLASH_TUI_REQUIRE_TERMINAL_TESTS: '1'
        run: |
          CGO_ENABLED=0 GOOS=linux go test -tags cli ./...
          CGO_ENABLED=0 GOOS=linux go vet -tags cli ./...
          cli_test_dir="$(mktemp -d)"
          CGO_ENABLED=0 GOOS=linux go build -tags cli -trimpath -o "$cli_test_dir/flclash" .
          sudo unshare --mount --pid --net --fork --mount-proc bash -c '
            set -euo pipefail
            mount --make-rprivate /
            mount -t tmpfs -o mode=755 tmpfs /run/user
            mkdir -m 700 /run/user/0
            export XDG_CONFIG_HOME=/run/user/0/test-config
            export XDG_STATE_HOME=/run/user/0/test-state
            export FLCLASH_EXIT_TEST_ISOLATED=1
            ip link set lo up
            bash "$1" "$2"
          ' bash ../packaging/tui-exit-test.sh "$cli_test_dir/flclash"

      - name: Test installer
        run: |
          bash -n install.sh packaging/build-linux.sh packaging/build-deb.sh packaging/native-package-test.sh packaging/install-script-test.sh packaging/tui-exit-test.sh packaging/tui-exit-isolated-test.sh
          bash packaging/install-script-test.sh

      - name: Test Windows helper
        working-directory: services/helper
        run: |
          cargo test --all-features
          cargo clippy --all-features -- -D warnings

  build:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: core/go.sum

      - name: Install packaging tools
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends rpm

      - name: Build TUI packages
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" == v* ]]; then
            VERSION="${VERSION#v}" packaging/build-linux.sh
          else
            unset VERSION
            packaging/build-linux.sh
          fi

      - name: Verify built package metadata
        working-directory: core
        env:
          FLCLASH_TEST_PACKAGE_DIR: ${{ github.workspace }}/dist
          FLCLASH_TEST_PACKAGE_ARCH: ${{ matrix.arch }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" == v* ]]; then
            package_version="${VERSION#v}"
          else
            package_version=$(sed -n 's/^const cliVersion = "\(.*\)"/\1/p' cli_main.go)
          fi
          FLCLASH_TEST_PACKAGE_VERSION="$package_version" CGO_ENABLED=0 GOOS=linux go test -tags cli ./internal/update -run '^TestBuiltLinuxPackages$' -count=1 -v

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-linux-${{ matrix.arch }}
          path: ./dist
          if-no-files-found: error
          overwrite: true

  package-smoke:
    needs: [ build ]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [debian, fedora, rocky, opensuse, arch, alpine, openwrt]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: artifact-linux-amd64
          path: dist
      - name: Install, run, and remove native package
        env:
          VERSION: ${{ github.ref_name }}
          DISTRO: ${{ matrix.distro }}
        run: |
          if [[ "$VERSION" == v* ]]; then
            package_version="${VERSION#v}"
          else
            package_version=$(sed -n 's/^const cliVersion = "\(.*\)"/\1/p' core/cli_main.go)
          fi
          bash packaging/native-package-test.sh "$DISTRO" "$PWD/dist" "$package_version"

  changelog:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          heading="## FlClash TUI $CURRENT_TAG"
          grep -Fxq "$heading" CHANGELOG.md && exit 0
          temp="$(mktemp)"
          if grep -Fxq '## Unreleased' CHANGELOG.md; then
            awk -v heading="$heading" '
              !replaced && $0 == "## Unreleased" { print heading; replaced=1; next }
              { print }
            ' CHANGELOG.md > "$temp"
          else
            previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
            range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
            {
              printf '%s\n\n' "$heading"
              git log --no-merges --pretty=format:'- %s%n' "$range"
              printf '\n'
              cat CHANGELOG.md
            } > "$temp"
          fi
          mv "$temp" CHANGELOG.md

      - name: Commit
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "chen08209@gmail.com"
            git config --local user.name "chen08209"
            git commit -m "Update changelog"
            if git push; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [ build, package-smoke ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Add installer and checksums
        run: |
          install -m 0755 install.sh ./dist/install.sh
          (
            cd ./dist
            sha256sum flclash-tui_* > SHA256SUMS
          )

      - name: Generate release.md
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
          range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
          : > release.md
          git log --no-merges --pretty=format:'- %s%n' "$range" >> release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          name: FlClash TUI ${{ github.ref_name }}
          files: ./dist/*
          body_path: './release.md'
          make_latest: true
