name: build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
env:
  IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
  FLUTTER_VERSION: '3.44.4'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: core/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Run plugin tests
        run: |
          (cd plugins/proxy && flutter pub get && flutter test --reporter expanded)
          (cd plugins/setup/buildkit/build_tool && dart pub get && dart test --reporter expanded)

      - name: Test Linux CLI
        working-directory: core
        run: |
          CGO_ENABLED=0 GOOS=linux go test -tags cli ./...
          CGO_ENABLED=0 GOOS=linux go vet -tags cli ./...

      - name: Test Windows helper
        working-directory: services/helper
        run: |
          cargo test --all-features
          cargo clippy --all-features -- -D warnings

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: windows
            os: Windows-2022
            arch: amd64
          - platform: linux
            os: ubuntu-22.04
            arch: amd64
          - platform: macos
            os: macos-15-intel
            arch: amd64
          - platform: macos
            os: macos-latest
            arch: arm64
          - platform: windows
            os: windows-11-arm
            arch: arm64
          - platform: linux
            os: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Android Signing
        if: startsWith(matrix.platform,'android')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          SERVICE_JSON_BASE64: ${{ secrets.SERVICE_JSON }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          values=(
            "$KEYSTORE_BASE64"
            "$SERVICE_JSON_BASE64"
            "$KEY_ALIAS"
            "$STORE_PASSWORD"
            "$KEY_PASSWORD"
          )
          configured=0
          for value in "${values[@]}"; do
            [[ -n "$value" ]] && configured=$((configured + 1))
          done
          if ((configured == 0)); then
            echo "Android release secrets are absent; using placeholder Firebase config and debug signing."
            exit 0
          fi
          if ((configured != ${#values[@]})); then
            echo "Android release secrets are only partially configured." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          printf '%s' "$SERVICE_JSON_BASE64" | base64 --decode > android/app/google-services.json
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASSWORD"
          } >> android/local.properties

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            core/go.sum

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.platform,'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Setup NDK
        if: startsWith(matrix.platform,'android')
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} -v

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  changelog:
    if: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/main
      - name: Generate
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          heading="## FlClash TUI $CURRENT_TAG"
          grep -Fxq "$heading" CHANGELOG.md && exit 0
          temp="$(mktemp)"
          if grep -Fxq '## Unreleased' CHANGELOG.md; then
            awk -v heading="$heading" '
              !replaced && $0 == "## Unreleased" { print heading; replaced=1; next }
              { print }
            ' CHANGELOG.md > "$temp"
          else
            previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
            range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
            {
              printf '%s\n\n' "$heading"
              git log --no-merges --pretty=format:'- %s%n' "$range"
              printf '\n'
              cat CHANGELOG.md
            } > "$temp"
          fi
          mv "$temp" CHANGELOG.md

      - name: Commit
        run: |
          git add CHANGELOG.md
          if ! git diff --cached --quiet; then
            echo "Commit pushing"
            git config --local user.email "chen08209@gmail.com"
            git config --local user.name "chen08209"
            git commit -m "Update changelog"
            if git push; then
              echo "Push succeeded"
            else
              echo "Push failed"
              exit 1
            fi
          fi

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  upload:
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    env:
      TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_API_ID != '' && secrets.TELEGRAM_API_HASH != '' && secrets.TELEGRAM_BOT_TOKEN != '' }}
      HOMEBREW_ENABLED: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY != '' && vars.HOMEBREW_OWNER != '' && vars.HOMEBREW_REPOSITORY != '' }}
      FDROID_ENABLED: ${{ secrets.SSH_DEPLOY_KEY != '' && vars.FDROID_OWNER != '' && vars.FDROID_REPOSITORY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Generate release.md
        env:
          CURRENT_TAG: ${{ github.ref_name }}
        run: |
          previous_tag="$(git describe --tags --abbrev=0 "$CURRENT_TAG^" 2>/dev/null || true)"
          range="${previous_tag:+$previous_tag..}$CURRENT_TAG"
          : > release.md
          git log --no-merges --pretty=format:'- %s%n' "$range" >> release.md

      - name: Patch release.md
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Generate sha256
        if: ${{ env.IS_STABLE == 'true' }}
        run: |
          cd ./dist
          sha256sum ./* > SHA256SUMS

      - name: Release
        if: ${{ env.IS_STABLE == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: './release.md'

      - name: Push to telegram
        if: env.TELEGRAM_ENABLED == 'true'
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TAG: ${{ github.ref_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          container_id="$(docker run --detach --rm \
            --publish 8081:8081 \
            --env TELEGRAM_API_ID \
            --env TELEGRAM_API_HASH \
            aiogram/telegram-bot-api:latest)"
          trap 'docker stop "$container_id" >/dev/null' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8081/ >/dev/null && break
            [[ "$attempt" == 30 ]] && exit 1
            sleep 1
          done
          python -m pip install requests
          python release_telegram.py

      - name: Create Homebrew Cask Source Dir
        if: ${{ env.IS_STABLE == 'true' && env.HOMEBREW_ENABLED == 'true' }}
        run: |
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          arm_sha=$(sha256sum "./dist/FlClash-${version}-macos-arm64.dmg" | awk '{print $1}')
          amd_sha=$(sha256sum "./dist/FlClash-${version}-macos-amd64.dmg" | awk '{print $1}')

          mkdir -p ./brew/Casks
          sed \
            -e "s|VERSION|$version|g" \
            -e "s|ARM_SHA256|$arm_sha|g" \
            -e "s|AMD_SHA256|$amd_sha|g" \
            ./.github/homebrew_cask_template.rb > ./brew/Casks/flclash.rb

      - name: Push to Homebrew tap
        if: ${{ env.IS_STABLE == 'true' && env.HOMEBREW_ENABLED == 'true' }}
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.HOMEBREW_SSH_DEPLOY_KEY }}
        with:
          source-directory: ./brew/
          destination-github-username: ${{ vars.HOMEBREW_OWNER }}
          destination-repository-name: ${{ vars.HOMEBREW_REPOSITORY }}
          user-name: 'github-actions[bot]'
          user-email: '41898282+github-actions[bot]@users.noreply.github.com'
          target-branch: main
          commit-message: Update Homebrew cask from ${{ github.ref_name }}
          target-directory: /

      - name: Create Fdroid Source Dir
        if: ${{ env.IS_STABLE == 'true' && env.FDROID_ENABLED == 'true' }}
        run: |
          mkdir -p ./tmp
          cp ./dist/*android-arm64-v8a* ./tmp/ || true
          echo "Files copied successfully"

      - name: Push to fdroid repo
        if: ${{ env.IS_STABLE == 'true' && env.FDROID_ENABLED == 'true' }}
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: ./tmp/
          destination-github-username: ${{ vars.FDROID_OWNER }}
          destination-repository-name: ${{ vars.FDROID_REPOSITORY }}
          user-name: 'github-actions[bot]'
          user-email: '41898282+github-actions[bot]@users.noreply.github.com'
          target-branch: main
          commit-message: Update from ${{ github.ref_name }}
          target-directory: /tmp/
